name = "Noperthedron"
defaultTargets = ["Noperthedron", "CayleyChecker", "Cayley"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.multiGoal = true
weak.linter.style.cdot = true

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "tryAtEachStep"
git = "https://github.com/dwrensha/tryAtEachStep"
rev = "lean-v4.35.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "Noperthedron"

# Build-on-demand verification of the expensive computational step; not in
# defaultTargets so CI never pays for it. See Noperthedron/ComputationalStep.lean.
[[lean_lib]]
name = "NativeCaseAnalysis"

[[lean_lib]]
name = "KernelCaseAnalysis"

# Patched copy of the `checkdecls` dependency's executable (see CheckDecls.lean):
# checks blueprint declarations against the defaultTargets libraries only, so
# the build-on-demand NativeCaseAnalysis/KernelCaseAnalysis libs don't break CI.
# Defined in the root package so `lake exe checkdecls` resolves to it.
[[lean_exe]]
name = "checkdecls"
root = "CheckDecls"
supportInterpreter = true
weakLinkArgs = ["-lLake"]

[[lean_exe]]
name = "constructValidTable"
root = "constructValidTable"
buildType = "release"

# Per-row timing of the live checkers; see the docstring in benchRows.lean.
[[lean_exe]]
name = "benchRows"
root = "benchRows"
buildType = "release"

# The rational-coordinate (Cayley) proof; see cayley/DESIGN.md.
# The Mathlib-free checker that the kernel runs (precompiled for the elaboration-time loader
# and `cayleyCheck`).
[[lean_lib]]
name = "CayleyChecker"
globs = ["CayleyChecker", "Cayley.Checker.+"]
precompileModules = true

# Soundness of the kernel checker (`Cayley.Pack.kernel_sound`). Builds without any
# generated data.
[[lean_lib]]
name = "Cayley"
globs = ["Cayley", "Cayley.Soundness.+"]

# The kernel-only proof: elaboration-time loader and generated chunk modules
# (`cayleyCheck kgen`). Not a default target.
[[lean_lib]]
name = "CayleyKernel"
globs = ["CayleyKernel.+"]

[[lean_exe]]
name = "cayleyCheck"
root = "cayleyCheck"
buildType = "release"
