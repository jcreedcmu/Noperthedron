name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read  # Read access to repository contents
  pages: write    # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build_project:
    # Pinned: on ubuntu-26.04 (the `ubuntu-latest` default since 2026-10-19) the docgen step
    # fails with "resource exhausted (error code: 12, not enough memory)" when spawning git
    # for the `srcUri.github` facets. ubuntu-24.04 runs it fine.
    runs-on: ubuntu-24.04
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Don't 'import Mathlib'
        run: |
          ! (find Noperthedron Cayley CayleyKernel -type f -name "*.lean" \
               -exec grep -Hn 'import Mathlib$' {} + )

      - name: Don't '#exit'
        run: |
          ! (find Noperthedron Cayley CayleyKernel -type f -name "*.lean" \
               -exec grep -Hn '^#exit$' {} + )

      - name: Build the project
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e # v1.4.0
        with:
          use-github-cache: false

      - name: "lake exe mk_all --check"
        run: |
          set -e
          lake exe mk_all --lib Noperthedron --check

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # 2026-10-05
        with:
          blueprint: true
          homepage: home_page
          # `home_page/Gemfile.lock` pins Jekyll 3.9, which predates the action's default Ruby 3.4.
          ruby-version: "3.1"
          # Deployment is done by the steps below, with a pause before `deploy-pages`.
          deploy: false

      - name: Upload website
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: home_page/_site

      # `deploy-pages` lists the run's artifacts as soon as it starts, and that listing can lag
      # behind an upload finalized a moment earlier (actions/deploy-pages#451); it then fails
      # with `No artifacts named "github-pages" were found`, before any deployment is created.
      # So a failed first attempt is retried once after a short pause.
      - name: Deploy to GitHub Pages
        id: deploy
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Pause before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 10

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
